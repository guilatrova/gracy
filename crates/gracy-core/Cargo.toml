[package]
name = "gracy-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
dashmap = "6.2.1"
parking_lot = "0.12.5"
regex = "1.13.0"
reqwest = { version = "0.13.4", features = ["json", "gzip", "brotli", "stream"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "rt"] }

[dev-dependencies]
tokio = { version = "1.52.3", features = ["rt", "sync", "time", "macros", "test-util", "rt-multi-thread"] }

[build-system]
requires = ["maturin>=1.14,<2.0"]
build-backend = "maturin"

[project]
name = "gracy"
version = "2.0.0a0"
description = "Python's most graceful API Client Framework — Rust-powered scheduling, throttling, retries, replay and reporting"
authors = [{ name = "Guilherme Latrova", email = "hello@guilatrova.dev" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10"
keywords = ["api", "client", "http", "throttling", "retry", "rust"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
httpx = ["httpx>=0.27"]
pydantic = ["pydantic>=2.0"]
msgspec = ["msgspec>=0.18"]
rich = ["rich>=13"]
plotly = ["plotly>=5", "pandas>=2"]
mongo = ["pymongo>=4"]

[project.urls]
Homepage = "https://github.com/guilatrova/gracy"
Repository = "https://github.com/guilatrova/gracy"
Changelog = "https://github.com/guilatrova/gracy/blob/main/CHANGELOG.md"

[tool.maturin]
python-source = "python"
module-name = "gracy._core"
manifest-path = "crates/gracy-py/Cargo.toml"
features = ["pyo3/extension-module"]

[dependency-groups]
dev = [
    "maturin>=1.14",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "pydantic>=2.0",
    "rich>=13",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["python"]

[tool.pyright]
include = ["python"]
pythonVersion = "3.10"
